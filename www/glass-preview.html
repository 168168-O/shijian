<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>达货爱姑娘 | Glass UI Preview</title>
  <link rel="stylesheet" href="glass-ui.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="time">9:41</div>
      <div class="status">
        <span class="network" aria-hidden="true"></span>
        <span class="dot" aria-hidden="true"></span>
      </div>
    </div>

    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <div class="name">达货爱姑娘</div>
          <div class="sub">insight</div>
        </div>
      </div>
      <div class="add-btn" aria-label="新建">＋</div>
    </header>

    <div class="chips">
      <span class="chip primary">今日分析</span>
      <span class="chip">39 场记录</span>
      <span class="chip success">在线校验</span>
    </div>

    <section class="card">
      <div class="card-header">
        <h3>题面灵感</h3>
        <span class="tag">RESEARCH</span>
      </div>
      <textarea class="textarea" aria-label="题面输入">暮投石壕村，有吏夜捉人。老翁逾墙走，老妇出门看。</textarea>
      <div class="actions">
        <button class="btn" type="button">开始分析</button>
        <button class="btn secondary" type="button">示例</button>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <h3>综合结果</h3>
        <span class="tag">TOP 3</span>
      </div>
      <div class="result-grid">
        <div class="result-item featured">
          <span>主候选</span>
          <strong>31</strong>
          <span>宝石</span>
        </div>
        <div class="result-item">
          <span>意象</span>
          <strong>35</strong>
          <span>猴子</span>
        </div>
        <div class="result-item">
          <span>关联</span>
          <strong>29</strong>
          <span>燕子</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="label">信心</div>
          <div class="value">86%</div>
        </div>
        <div class="stat">
          <div class="label">热度</div>
          <div class="value">7.2</div>
        </div>
        <div class="stat">
          <div class="label">频次</div>
          <div class="value">3</div>
        </div>
      </div>
    </section>

    <nav class="navbar" aria-label="主导航">
      <div class="nav-item active"><div class="nav-icon">✦</div>分析</div>
      <div class="nav-item"><div class="nav-icon">▣</div>记录</div>
      <div class="nav-item"><div class="nav-icon">↗</div>统计</div>
      <div class="nav-item"><div class="nav-icon">◎</div>我的</div>
    </nav>
  </div>
</body>
</html>
