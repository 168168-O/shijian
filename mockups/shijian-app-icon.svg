<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">诗鉴 App 图标概念</title>
  <desc id="desc">午夜蓝紫色玻璃底座，中心以香槟金线条构成诗卷与星芒，表达诗意分析和灵感洞察。</desc>
  <defs>
    <linearGradient id="bg" x1=".08" y1=".04" x2=".95" y2="1"><stop stop-color="#20294c"/><stop offset=".52" stop-color="#111a31"/><stop offset="1" stop-color="#091422"/></linearGradient>
    <linearGradient id="gold" x1=".15" y1="0" x2=".9" y2="1"><stop stop-color="#fff1c8"/><stop offset=".42" stop-color="#d9b66f"/><stop offset="1" stop-color="#9f7745"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a89aff" stop-opacity=".7"/><stop offset="1" stop-color="#56d9dc" stop-opacity=".2"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#8977ff" stop-opacity=".3"/><stop offset="1" stop-color="#8977ff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="24"/><feOffset dy="24"/><feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <circle cx="510" cy="470" r="410" fill="url(#halo)"/>
  <path d="M94 221C275 92 650 86 899 255" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="3"/>
  <g filter="url(#shadow)">
    <!-- floating glass plaque -->
    <rect x="176" y="170" width="672" height="672" rx="190" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".13" stroke-width="3"/>
    <rect x="193" y="187" width="638" height="638" rx="174" fill="none" stroke="url(#violet)" stroke-opacity=".55" stroke-width="2"/>
    <!-- open poetry scroll -->
    <path d="M337 346c0-34 25-58 58-58h229c34 0 58 24 58 58v313c0 34-24 58-58 58H395c-33 0-58-24-58-58V346Z" fill="#101a2d" fill-opacity=".68" stroke="url(#gold)" stroke-width="17" stroke-linejoin="round"/>
    <path d="M348 365c0-30 20-50 49-50h215c29 0 49 20 49 50" fill="none" stroke="#fff1c8" stroke-opacity=".6" stroke-width="8" stroke-linecap="round"/>
    <!-- refined poem strokes -->
    <path d="M425 409h160M425 463h119M425 517h145M425 571h92" stroke="url(#gold)" stroke-width="17" stroke-linecap="round" opacity=".9"/>
    <path d="M425 625h132" stroke="#8c9bbb" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <!-- insight star, intentionally simple and legible at small sizes -->
    <g transform="translate(652 605)" filter="url(#glow)">
      <path d="M0-139C19-54 42-23 128 0 42 21 19 54 0 139-20 54-43 21-128 0-43-23-20-54 0-139Z" fill="url(#gold)"/>
      <circle r="24" fill="#fff7de"/>
    </g>
    <circle cx="704" cy="402" r="16" fill="#75e2df"/>
    <circle cx="704" cy="402" r="31" fill="none" stroke="#75e2df" stroke-opacity=".36" stroke-width="3"/>
  </g>
  <!-- discreet seal accent -->
  <g transform="translate(740 744) rotate(8)">
    <rect x="-48" y="-48" width="96" height="96" rx="25" fill="#d7b574" fill-opacity=".12" stroke="#e8cb8f" stroke-opacity=".58" stroke-width="3"/>
    <path d="M-23-20h46M-23 0h46M-23 20h30" stroke="#f1d89e" stroke-width="6" stroke-linecap="round" opacity=".88"/>
  </g>
  <path d="M240 799c140 55 407 60 548-4" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="3"/>
</svg>
