<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">达货爱姑娘｜高端玻璃风格界面效果图</title>
  <desc id="desc">手机端诗鉴分析界面概念稿：深色渐变背景、玻璃卡片、简化输入、重点结果与底部导航。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101425"/><stop offset=".52" stop-color="#17172b"/><stop offset="1" stop-color="#101d28"/></linearGradient>
    <radialGradient id="glowA"><stop stop-color="#7664ff" stop-opacity=".35"/><stop offset="1" stop-color="#7664ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop stop-color="#36d7c2" stop-opacity=".22"/><stop offset="1" stop-color="#36d7c2" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity=".045"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a795ff"/><stop offset="1" stop-color="#6c7dff"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63e8d0"/><stop offset="1" stop-color="#42bcae"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="430" height="932" rx="42" fill="url(#bg)"/>
  <circle cx="48" cy="180" r="190" fill="url(#glowA)" filter="url(#blur)"/>
  <circle cx="404" cy="612" r="180" fill="url(#glowB)" filter="url(#blur)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#f5f4ff">
    <!-- status -->
    <text x="28" y="34" font-size="13" font-weight="600">9:41</text>
    <g transform="translate(356 21)" stroke="#f5f4ff" stroke-width="1.7" fill="none"><path d="M0 10 Q7 2 14 10 M3 13 Q7 8 11 13 M6 16 Q7 15 8 16"/><rect x="22" y="5" width="22" height="12" rx="3"/><rect x="24" y="7" width="15" height="8" rx="1.5" fill="#f5f4ff" stroke="none"/><path d="M45 9v4"/></g>
    <!-- header -->
    <text x="27" y="83" font-size="13" fill="#a8a7c7" letter-spacing="2">SHI JIAN  ·  INSIGHT</text>
    <text x="27" y="122" font-size="28" font-weight="700">达货爱姑娘</text>
    <text x="28" y="147" font-size="12" fill="#aaa9c4">诗意解读 · 灵感分析</text>
    <g transform="translate(345 88)"><circle cx="24" cy="24" r="23" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/><path d="M24 13v22M13 24h22" stroke="#dad6ff" stroke-width="1.8" stroke-linecap="round"/></g>
    <!-- chips -->
    <g transform="translate(27 171)"><rect width="94" height="27" rx="13.5" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".1"/><circle cx="13" cy="13.5" r="3" fill="#63e8d0"/><text x="23" y="18" font-size="11" fill="#cfcee1">今日分析</text>
      <rect x="102" width="92" height="27" rx="13.5" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".1"/><text x="115" y="18" font-size="11" fill="#cfcee1">记录 39 场</text>
    </g>
    <!-- input card -->
    <g filter="url(#shadow)"><rect x="20" y="218" width="390" height="245" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/><path d="M44 219h342" stroke="#fff" stroke-opacity=".16"/></g>
    <text x="42" y="253" font-size="17" font-weight="650">题面灵感</text>
    <text x="42" y="276" font-size="11" fill="#aaa9c4">输入诗句或关键词，开始一场轻量分析</text>
    <rect x="40" y="294" width="350" height="94" rx="15" fill="#0c1020" fill-opacity=".38" stroke="#fff" stroke-opacity=".1"/>
    <text x="57" y="326" font-size="14" fill="#f2efff">暮投石壕村，有吏夜捉人。</text>
    <text x="57" y="351" font-size="14" fill="#d5d2e8">老翁逾墙走，老妇出门看。</text>
    <text x="57" y="373" font-size="10" fill="#85849f">诗句越完整，分析越有参考性</text>
    <g transform="translate(40 405)"><rect width="130" height="37" rx="12" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".12"/><text x="17" y="24" font-size="12" fill="#c7c5dd">＋ 添加提示词</text>
      <rect x="180" width="170" height="39" rx="13" fill="url(#accent)"/><text x="219" y="25" font-size="13" font-weight="650" fill="#fff">开始分析</text><path d="M330 14l6 6-6 6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- result heading -->
    <text x="27" y="508" font-size="19" font-weight="700">灵感结果</text>
    <text x="340" y="507" font-size="11" fill="#a7a5c1">查看全部　›</text>
    <!-- result card -->
    <g filter="url(#shadow)"><rect x="20" y="527" width="390" height="230" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/></g>
    <text x="42" y="561" font-size="12" fill="#aaa9c4">综合参考 · 仅供灵感</text>
    <g transform="translate(40 581)">
      <rect width="104" height="112" rx="18" fill="#a795ff" fill-opacity=".13" stroke="#a795ff" stroke-opacity=".38"/><circle cx="52" cy="43" r="25" fill="url(#accent)"/><text x="52" y="51" text-anchor="middle" font-size="22" font-weight="700">31</text><text x="52" y="88" text-anchor="middle" font-size="13" font-weight="600">宝石</text><text x="52" y="103" text-anchor="middle" font-size="9" fill="#b9b5d5">灵感较强</text>
      <rect x="122" width="104" height="112" rx="18" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".12"/><circle cx="174" cy="43" r="25" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".13"/><text x="174" y="51" text-anchor="middle" font-size="22" font-weight="650">35</text><text x="174" y="88" text-anchor="middle" font-size="13" font-weight="600">猴子</text><text x="174" y="103" text-anchor="middle" font-size="9" fill="#aaa9c4">关联意象</text>
      <rect x="244" width="104" height="112" rx="18" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".12"/><circle cx="296" cy="43" r="25" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".13"/><text x="296" y="51" text-anchor="middle" font-size="22" font-weight="650">29</text><text x="296" y="88" text-anchor="middle" font-size="13" font-weight="600">燕子</text><text x="296" y="103" text-anchor="middle" font-size="9" fill="#aaa9c4">关联意象</text>
    </g>
    <g transform="translate(42 716)"><circle cx="4" cy="0" r="3" fill="#63e8d0"/><text x="14" y="4" font-size="10" fill="#aaa9c4">把复杂依据收在详情里，先看重点</text><text x="345" y="4" font-size="10" fill="#bcb9d5">依据　⌄</text></g>
    <!-- bottom nav -->
    <rect x="12" y="790" width="406" height="78" rx="24" fill="#171a2c" fill-opacity=".9" stroke="#fff" stroke-opacity=".13"/>
    <g text-anchor="middle" font-size="10">
      <g transform="translate(58 813)" fill="#a795ff"><path d="M0 10l10-9 10 9v12H0z" fill="none" stroke="#a795ff" stroke-width="1.6"/><text x="10" y="39" fill="#bcb5ff">分析</text></g>
      <g transform="translate(158 813)" fill="#85849f"><path d="M2 2h16v20H2z" fill="none" stroke="#85849f" stroke-width="1.5"/><path d="M6 7h8M6 11h8M6 15h6" stroke="#85849f"/><text x="10" y="39" fill="#9694ae">记录</text></g>
      <g transform="translate(258 813)" fill="#85849f"><path d="M2 21V12h4v9M9 21V5h4v16M16 21V9h4v12" fill="none" stroke="#85849f" stroke-width="1.5"/><text x="12" y="39" fill="#9694ae">统计</text></g>
      <g transform="translate(358 813)" fill="#85849f"><circle cx="10" cy="8" r="3.5" fill="none" stroke="#85849f" stroke-width="1.5"/><path d="M3 22c1-5 13-5 14 0" fill="none" stroke="#85849f" stroke-width="1.5"/><text x="10" y="39" fill="#9694ae">我的</text></g>
    </g>
    <rect x="155" y="884" width="120" height="4" rx="2" fill="#fff" fill-opacity=".72"/>
  </g>
</svg>
